<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinguaFlow — Translator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <header>
    <div class="logo">⬡ LinguaFlow</div>
    <nav>
      <button class="nav-btn active" onclick="showTab('translator')">Translate</button>
      <button class="nav-btn" onclick="showTab('history')">History</button>
    </nav>
  </header>

  <main>

    <!-- TRANSLATOR TAB -->
    <div id="tab-translator" class="tab active">

      <div class="card">

        <!-- LEFT: Input -->
        <div class="panel">
          <div class="panel-top">
            <span class="lang-label">Detected: <strong id="detected-lang">—</strong></span>
            <button class="icon-btn" id="micBtn" title="Voice input">🎤</button>
          </div>
          <textarea id="inputText" placeholder="Type here to translate…" maxlength="2000"></textarea>
          <div class="panel-bottom">
            <span id="charCount">0</span> / 2000
            <button class="icon-btn" onclick="clearInput()">🗑️</button>
          </div>
        </div>

        <!-- RIGHT: Output -->
        <div class="panel output-panel">
          <div class="panel-top">
            <select id="destLang">
              <option value="en">English</option>
              <option value="hi">Hindi</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="es">Spanish</option>
              <option value="pt">Portuguese</option>
              <option value="it">Italian</option>
              <option value="ru">Russian</option>
              <option value="zh-cn">Chinese (Simplified)</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="ar">Arabic</option>
              <option value="tr">Turkish</option>
              <option value="nl">Dutch</option>
              <option value="pl">Polish</option>
              <option value="sv">Swedish</option>
              <option value="bn">Bengali</option>
              <option value="ta">Tamil</option>
              <option value="te">Telugu</option>
              <option value="mr">Marathi</option>
              <option value="ur">Urdu</option>
              <option value="gu">Gujarati</option>
              <option value="kn">Kannada</option>
              <option value="ml">Malayalam</option>
              <option value="pa">Punjabi</option>
            </select>
            <button class="icon-btn" id="ttsBtn" title="Listen">🔊</button>
            <button class="icon-btn" id="copyBtn" title="Copy">📋</button>
          </div>
          <div id="outputText" class="output-box">Translation will appear here…</div>
          <div class="panel-bottom">
            <span id="statusMsg"></span>
          </div>
        </div>

      </div><!-- /.card -->

      <button class="translate-btn" id="translateBtn" onclick="doTranslate()">
        Translate
      </button>

      <div class="error-box" id="errorBox" style="display:none"></div>

    </div><!-- /#tab-translator -->

    <!-- HISTORY TAB -->
    <div id="tab-history" class="tab">
      <h2>Translation History</h2>
      <div id="historyList">Loading…</div>
    </div>

  </main>

  <footer>Built with Flask &amp; Python · LinguaFlow</footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
